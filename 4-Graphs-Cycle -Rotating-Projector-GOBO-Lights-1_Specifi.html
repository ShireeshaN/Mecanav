<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Carousel with Light Toggle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Owl Carousel CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css"/>

  <style>
    body {
      background: #f0f0f0;
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
    }

    .partners-section {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      max-width: 1300px;
      margin: auto;
    }

    .partner-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 150px;
    }

    .partner-logo img {
      max-height: 120px;
      width: auto;
      transition: opacity 0.5s ease-in-out;
    }

    .owl-nav button {
      position: absolute;
      top: 35%;
    }

    .owl-nav .owl-prev {
      left: -30px;
    }

    .owl-nav .owl-next {
      right: -30px;
    }
  </style>
</head>
<body>

  <div class="partners-section">
    <div id="partners-carousel" class="owl-carousel owl-theme">

      <!-- Repeat these blocks for 10 different products -->
      <div class="item">
        <a class="partner-logo" href="#!">
          <img class="toggle-image"
            src="assets/images/Final-Products/Product spec imgs/flood_off0.webp"
            data-off="assets/images/Final-Products/Product spec imgs/flood_off0.webp"
            data-on="assets/images/Final-Products/Product spec imgs/flood_on.webp"
            alt="Product 1"
          />
        </a>
      </div>

      <div class="item">
        <a class="partner-logo" href="#!">
          <img class="toggle-image"
            src="assets/images/brands/pr2-off.webp"
            data-off="assets/images/brands/pr2-off.webp"
            data-on="assets/images/brands/pr2-on.webp"
            alt="Product 2"
          />
        </a>
      </div>

      <div class="item">
        <a class="partner-logo" href="#!">
          <img class="toggle-image"
            src="assets/images/brands/pr3-off.webp"
            data-off="assets/images/brands/pr3-off.webp"
            data-on="assets/images/brands/pr3-on.webp"
            alt="Product 3"
          />
        </a>
      </div>

      <div class="item">
        <a class="partner-logo" href="#!">
          <img class="toggle-image"
            src="assets/images/brands/pr4-off.webp"
            data-off="assets/images/brands/pr4-off.webp"
            data-on="assets/images/brands/pr4-on.webp"
            alt="Product 4"
          />
        </a>
      </div>

      <div class="item">
        <a class="partner-logo" href="#!">
          <img class="toggle-image"
            src="assets/images/brands/pr5-off.webp"
            data-off="assets/images/brands/pr5-off.webp"
            data-on="assets/images/brands/pr5-on.webp"
            alt="Product 5"
          />
        </a>
      </div>

      <div class="item">
        <a class="partner-logo" href="#!">
          <img class="toggle-image"
            src="assets/images/brands/pr6-off.webp"
            data-off="assets/images/brands/pr6-off.webp"
            data-on="assets/images/brands/pr6-on.webp"
            alt="Product 6"
          />
        </a>
      </div>

      <div class="item">
        <a class="partner-logo" href="#!">
          <img class="toggle-image"
            src="assets/images/brands/pr7-off.webp"
            data-off="assets/images/brands/pr7-off.webp"
            data-on="assets/images/brands/pr7-on.webp"
            alt="Product 7"
          />
        </a>
      </div>

      <div class="item">
        <a class="partner-logo" href="#!">
          <img class="toggle-image"
            src="assets/images/brands/pr8-off.webp"
            data-off="assets/images/brands/pr8-off.webp"
            data-on="assets/images/brands/pr8-on.webp"
            alt="Product 8"
          />

      </div>

      <div class="item">
        <a class="partner-logo" href="#!">
          <img class="toggle-image"

      <div class="item">
        <a class="partner-logo" href="#!">
          <img class="toggle-image"
            src="assets/images/brands/pr10-off.webp"
            data-off="assets/images/brands/pr10-off.webp"
            data-on="assets/images/brands/pr10-on.webp"
            alt="Product 10"
          />
        </a>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>

  <script>
    $(document).ready(function () {
      // Initialize Owl Carousel
      $('#partners-carousel').owlCarousel({
        loop: true,
        margin: 30,
        nav: true,
        autoplay: true,
        autoplayTimeout: 3000,
        autoplayHoverPause: false,
        responsive: {
          0: { items: 2 },
          600: { items: 3 },
          1000: { items: 5 }
        }
      });

      // Image toggle effect (off <-> on) every 1.5 seconds
      setInterval(() => {
        $('.toggle-image').each(function () {
          const off = $(this).data('off');
          const on = $(this).data('on');
          const current = $(this).attr('src');
          $(this).fadeOut(200, () => {
            $(this).attr('src', current.includes('off') ? on : off).fadeIn(200);
          });
        });
      }, 1500);
    });
  </script>

</body>
</html>
